services:
  postgres:
    image: 'postgres:latest'
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
  mongodb:
    image: mongo:latest
    ports:
    - "27017:27017"
  kafka:
    image: apache/kafka:latest
    ports:
     - "9092:9092"
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
